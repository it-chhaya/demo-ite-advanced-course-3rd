server:
  port: 8585

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true # enable to work with nacos service discovery
              lower-case-service-id: true
    nacos:
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: qwer
      server-addr: 127.0.0.1:8848
